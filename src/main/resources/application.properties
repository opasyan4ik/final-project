spring.application.name=FinalProject

spring.datasource.url=jdbc:postgresql://localhost:5432/online_course_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.finalproject=INFO
logging.level.org.springframework.security=INFO

pakstanislav.app.jwtSecret=PakStanislavSuperSecretJwtKeyForFinalProject2026MustBeLongEnough
pakstanislav.app.jwtExpirationMs=86400000
pakstanislav.app.file-upload-dir=uploads/lessons
